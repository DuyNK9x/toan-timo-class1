<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMO Math Grade 1 - Easy Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #f0f9ff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 24px; border: 4px solid #3b82f6; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .score-badge { background: #fef08a; color: #854d0e; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 18px; border: 2px solid #eab308; cursor: pointer; }
        .user-tag { font-size: 14px; font-weight: bold; color: #1e40af; background: #dbeafe; padding: 6px 12px; border-radius: 12px; }

        .topic-menu { display: grid; gap: 10px; margin-top: 15px; }
        .topic-btn { background: #eff6ff; border: 3px solid #60a5fa; border-radius: 16px; padding: 14px 18px; font-size: 16px; font-weight: bold; color: #1e40af; cursor: pointer; text-align: left; transition: all 0.2s; }
        .topic-btn:hover { background: #dbeafe; transform: translateY(-2px); }
        .exam-btn { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
        .store-btn { background: #fce7f3; border-color: #ec4899; color: #9d174d; text-align: center; }
        .parent-btn { background: #f1f5f9; border-color: #94a3b8; color: #475569; text-align: center; }

        /* Danh sách tài khoản đã lưu */
        .account-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .account-card { background: #f0f9ff; border: 2px solid #3b82f6; border-radius: 16px; padding: 14px; font-size: 18px; font-weight: bold; color: #1e40af; cursor: pointer; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .account-card:hover { background: #dbeafe; }

        .toy-cabinet { background: #fff7ed; border: 2px dashed #fdba74; border-radius: 16px; padding: 12px; margin-top: 15px; text-align: center; }
        .toy-cabinet-title { font-size: 15px; font-weight: bold; color: #c2410c; margin-bottom: 8px; }
        .toy-list { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; min-height: 40px; align-items: center; }
        .toy-item { font-size: 32px; animation: bounce 2s infinite alternate; }

        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

        .auth-box { text-align: center; padding: 10px; }
        .auth-input { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #cbd5e1; border-radius: 12px; margin-bottom: 12px; text-align: center; font-weight: bold; }
        
        .question-title { font-size: 20px; color: #1e3a8a; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .canvas-container { background: #fafafa; border: 3px dashed #cbd5e1; border-radius: 16px; position: relative; text-align: center; padding: 15px; margin-bottom: 15px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hint-text { font-size: 13px; color: #64748b; margin-top: 8px; font-style: italic; }
        
        svg { max-width: 100%; height: auto; }
        .clickable-edge { stroke: #3b82f6; stroke-width: 8; stroke-linecap: round; cursor: pointer; }
        .clickable-edge.clicked { stroke: #ef4444; stroke-width: 10; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .opt-btn { background: #f1f5f9; border: 3px solid #cbd5e1; border-radius: 16px; padding: 14px; font-size: 22px; font-weight: bold; color: #1e293b; cursor: pointer; }
        .opt-btn.selected { background: #3b82f6; color: white; border-color: #1d4ed8; }
        .opt-btn.correct-ans { background: #22c55e; color: white; border-color: #15803d; }
        .opt-btn.wrong-ans { background: #ef4444; color: white; border-color: #b91c1c; }

        .action-btn { width: 100%; background: #0284c7; color: white; border: none; border-radius: 16px; padding: 16px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #0369a1; }
        .action-btn.next-mode { background: #22c55e; box-shadow: 0 4px 0 #15803d; }
        .warning-btn { background: #eab308; box-shadow: 0 4px 0 #ca8a04; color: #713f12; margin-top: 10px; }
        .danger-btn { background: #ef4444; box-shadow: 0 4px 0 #b91c1c; margin-top: 10px; }
        
        .back-btn { background: none; border: none; color: #64748b; font-size: 15px; font-weight: bold; cursor: pointer; }
        .feedback { text-align: center; font-size: 18px; font-weight: bold; min-height: 28px; margin-bottom: 10px; }
        .correct { color: #16a34a; }
        .wrong { color: #dc2626; }

        .store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; max-height: 420px; overflow-y: auto; padding-right: 5px; }
        .store-item { background: #fdf2f8; border: 2px solid #f472b6; border-radius: 16px; padding: 12px; text-align: center; }
        .store-icon { font-size: 40px; margin-bottom: 4px; }
        .store-name { font-weight: bold; color: #831843; font-size: 13px; margin-bottom: 4px; }
        .buy-btn { background: #ec4899; color: white; border: none; border-radius: 12px; padding: 8px 12px; font-weight: bold; cursor: pointer; width: 100%; }
        .buy-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        .stat-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .stat-bar { background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; display: flex; }
        .stat-fill-correct { background: #22c55e; height: 100%; }
        .stat-fill-wrong { background: #ef4444; height: 100%; }
        .number-text { font-size: 30px; font-weight: bold; color: #1d4ed8; letter-spacing: 2px; }
        .text-problem { font-size: 18px; color: #334155; line-height: 1.6; font-weight: 600; text-align: left; }
    </style>
</head>
<body>

<div class="app-card">
    <!-- HEADER -->
    <div class="header">
        <button class="back-btn" id="back-btn" onclick="showMenu()" style="display: none;">◀ Trang chủ</button>
        <span class="user-tag" id="user-display">Bé: Chưa chọn</span>
        <span style="font-size: 15px; font-weight: bold; color: #64748b;" id="progress"></span>
        <div class="score-badge" onclick="openStore()">⭐ <span id="stars">0</span></div>
    </div>

    <!-- MÀN HÌNH ĐĂNG NHẬP / CHỌN TÀI KHOẢN CÓ SẴN -->
    <div id="auth-screen">
        <h2 style="text-align: center; color: #1e3a8a; margin-top: 0;">👋 XIN CHÀO BÉ!</h2>
        
        <!-- DANH SÁCH TÀI KHOẢN ĐÃ LƯU -->
        <div id="saved-accounts-box" style="display: none;">
            <p style="color: #475569; font-weight: bold; margin-bottom: 8px;">Chọn tài khoản của bé:</p>
            <div class="account-list" id="account-list"></div>
            <p style="text-align: center; color: #64748b; font-size: 14px; margin: 10px 0;">--- Hoặc ---</p>
        </div>

        <!-- TẠO TÀI KHOẢN MỚI -->
        <div class="auth-box">
            <p style="color: #475569; font-weight: 600; margin-top: 0;">Nhập tên bé mới:</p>
            <input type="text" id="student-name-input" class="auth-input" placeholder="Ví dụ: Bé Bi, Bé Nam..." maxlength="20">
            <div id="auth-error-msg" style="color: #ef4444; font-weight: bold; margin-bottom: 10px; display: none;"></div>
            <button class="action-btn" onclick="createNewStudent()">TẠO & VÀO HỌC NGAY ➔</button>
        </div>
    </div>

    <!-- MENU CHÍNH -->
    <div id="menu-screen" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="color: #1e3a8a; margin: 0;">🎯 TOÁN TIMO 1</h2>
            <button class="back-btn" onclick="logoutStudent()" style="color: #ef4444;">[Đổi Bé Khác]</button>
        </div>

        <div class="topic-menu">
            <button class="topic-btn exam-btn" onclick="startMode('EXAM')">🏆 THI THỬ 25 CÂU</button>
            <button class="topic-btn" onclick="startMode('LOGIC')">🧠 1. Tư duy Logic</button>
            <button class="topic-btn" onclick="startMode('ARITHMETIC')">🔢 2. Số học</button>
            <button class="topic-btn" onclick="startMode('NUMBER_THEORY')">💡 3. Lý thuyết số</button>
            <button class="topic-btn" onclick="startMode('GEOMETRY')">📐 4. Hình học</button>
            <button class="topic-btn" onclick="startMode('COMBINATORICS')">🧩 5. Tổ hợp</button>
            <button class="topic-btn store-btn" onclick="openStore()">🎁 CỬA HÀNG BÁU VẬT & SIÊU XE</button>
            <button class="topic-btn parent-btn" onclick="openParentDashboard()">🔒 BẢNG ĐIỀU KHIỂN CHO BỐ</button>
        </div>

        <div class="toy-cabinet">
            <div class="toy-cabinet-title">🧸 Bộ sưu tập của bé:</div>
            <div class="toy-list" id="my-toys">Chưa có món quà nào. Hãy tích sao đổi nhé!</div>
        </div>
    </div>

    <!-- CỬA HÀNG -->
    <div id="store-screen" style="display: none;">
        <h2 style="text-align: center; color: #9d174d; margin-top: 0; margin-bottom: 5px;">🎁 CỬA HÀNG BÁU VẬT</h2>
        <p style="text-align: center; color: #475569; font-size: 13px; margin-top: 0;">Làm bài đúng tích ⭐ đổi Báu Vật & Siêu Xe nhé!</p>
        <div class="store-grid" id="store-items"></div>
    </div>

    <!-- LÀM BÀI -->
    <div id="quiz-screen" style="display: none;">
        <div class="question-title" id="question-text">...</div>
        <div class="canvas-container" id="display-area"></div>
        <div class="feedback" id="feedback"></div>
        <div class="options-grid" id="options"></div>
        <button class="action-btn" id="confirm-btn" onclick="confirmAnswer()" style="display: none;">✔ Xác Nhận Đáp Án</button>
        <button class="action-btn next-mode" id="next-btn" onclick="nextQuestion()" style="display: none;">Câu tiếp theo ➔</button>
    </div>

    <!-- BẢNG BỐ -->
    <div id="parent-screen" style="display: none;">
        <h2 style="color: #1e3a8a; margin-top: 0;">📊 THỐNG KÊ TIẾN ĐỘ CỦA BÉ</h2>
        <p style="color: #64748b; font-size: 14px;">Tổng số câu đã làm: <b id="total-done-count" style="color:#1e293b;">0</b> câu</p>
        <div id="stats-container"></div>
        
        <hr style="border:0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
        <button class="action-btn warning-btn" onclick="resetStars()">⭐ RESET CHỈ SỐ NGÔI SAO VỀ 0</button>
        <button class="action-btn danger-btn" onclick="resetAllData()">💥 RESET TOÀN BỘ DỮ LIỆU & TIẾN ĐỘ</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBzxLTKqhZaxHOBrH6FCswjittFNQTstxg",
        authDomain: "timo-math-app.firebaseapp.com",
        databaseURL: "https://timo-math-app-default-rtdb.firebaseio.com",
        projectId: "timo-math-app",
        storageBucket: "timo-math-app.firebasestorage.app",
        messagingSenderId: "693516474042",
        appId: "1:693516474042:web:155b559c464cb6fafd9483",
        measurementId: "G-KMB1FQDVNT"
    };

    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) {}

    let currentStudentId = '';
    let currentStudentName = '';
    
    function getDefaultStats() {
        return {
            stars: 0,
            totalDone: 0,
            myToys: [],
            topics: {
                'LOGIC': { name: 'Tư duy Logic', correct: 0, wrong: 0, timeTotal: 0 },
                'ARITHMETIC': { name: 'Số học', correct: 0, wrong: 0, timeTotal: 0 },
                'NUMBER_THEORY': { name: 'Lý thuyết số', correct: 0, wrong: 0, timeTotal: 0 },
                'GEOMETRY': { name: 'Hình học', correct: 0, wrong: 0, timeTotal: 0 },
                'COMBINATORICS': { name: 'Tổ hợp', correct: 0, wrong: 0, timeTotal: 0 }
            }
        };
    }

    let userStats = getDefaultStats();

    const availableToys = [
        { id: 'coin', name: 'Đồng Xu Vàng', icon: '🪙', price: 20 },
        { id: 'diamond', name: 'Kim Cương Đỏ', icon: '💎', price: 30 },
        { id: 'bomb', name: 'Quả Bom', icon: '💣', price: 30 },
        { id: 'cup', name: 'Cúp Vô Địch', icon: '🏆', price: 40 },
        { id: 'crown', name: 'Vương Miện Vua', icon: '👑', price: 40 },
        { id: 'sword', name: 'Song Đao', icon: '⚔️', price: 50 },
        { id: 'shield', name: 'Khiên Báu', icon: '🛡️', price: 50 },
        { id: 'police', name: 'Xe Cảnh Sát', icon: '🚓', price: 40 },
        { id: 'fire', name: 'Xe Cứu Hỏa', icon: '🚒', price: 40 },
        { id: 'lambo', name: 'Siêu Xe Lambo', icon: '🏎️', price: 60 },
        { id: 'jet', name: 'Máy Bay Chiến Đấu', icon: '✈️', price: 80 },
        { id: 'rocket', name: 'Tên Lửa Vũ Trụ', icon: '🚀', price: 90 },
        { id: 'spiderman', name: 'Spider-Man', icon: '🕷️', price: 50 },
        { id: 'superman', name: 'Superman', icon: '🦸‍♂️', price: 60 },
        { id: 'batman', name: 'Batman', icon: '🦇', price: 60 },
        { id: 'ironman', name: 'Iron Man', icon: '🦾', price: 70 },
        { id: 'optimus', name: 'Optimus Prime', icon: '🚛', price: 90 },
        { id: 'bumblebee', name: 'Bumblebee', icon: '🐝', price: 90 },
        { id: 'gundam', name: 'Robot Gundam', icon: '🤖', price: 100 },
        { id: 'trex', name: 'Khủng Long T-Rex', icon: '🦖', price: 100 },
        { id: 'dragon', name: 'Rồng Lửa', icon: '🐉', price: 110 }
    ];

    // LẤY DANH SÁCH TÀI KHOẢN ĐÃ KHAI BÁO
    function renderSavedAccounts() {
        const savedList = JSON.parse(localStorage.getItem('timo_account_list') || '[]');
        const container = document.getElementById('account-list');
        const box = document.getElementById('saved-accounts-box');

        if (savedList.length > 0) {
            box.style.display = 'block';
            container.innerHTML = '';
            savedList.forEach(acc => {
                const card = document.createElement('div');
                card.className = 'account-card';
                card.innerHTML = `<span>👦 ${acc.name}</span> <span>➔</span>`;
                card.onclick = () => selectAccount(acc.id, acc.name);
                container.appendChild(card);
            });
        } else {
            box.style.display = 'none';
        }
    }

    // CHỌN TÀI KHOẢN CÓ SẴN
    function selectAccount(id, name) {
        currentStudentId = id;
        currentStudentName = name;
        enterApp();
    }

    // TẠO TÀI KHOẢN MỚI
    function createNewStudent() {
        const nameInput = document.getElementById('student-name-input').value.trim();
        const err = document.getElementById('auth-error-msg');

        if (!nameInput) {
            err.style.display = 'block';
            err.innerText = '⚠️ Bé hãy nhập tên trước nhé!';
            return;
        }
        err.style.display = 'none';

        currentStudentName = nameInput;
        currentStudentId = nameInput.toLowerCase().replace(/\s+/g, '_');

        // Lưu vào danh sách tài khoản thiết bị
        let savedList = JSON.parse(localStorage.getItem('timo_account_list') || '[]');
        if (!savedList.some(a => a.id === currentStudentId)) {
            savedList.push({ id: currentStudentId, name: currentStudentName });
            localStorage.setItem('timo_account_list', JSON.stringify(savedList));
        }

        enterApp();
    }

    function enterApp() {
        document.getElementById('user-display').innerText = `Bé: ${currentStudentName}`;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('menu-screen').style.display = 'block';
        loadProgress();
    }

    function logoutStudent() {
        currentStudentId = '';
        currentStudentName = '';
        document.getElementById('user-display').innerText = `Bé: Chưa chọn`;
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('auth-screen').style.display = 'block';
        renderSavedAccounts();
    }

    function loadProgress() {
        if (!currentStudentId) return;
        if (db) {
            db.ref('students/' + currentStudentId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) { userStats = data; if(!userStats.myToys) userStats.myToys = []; }
                else { userStats = getDefaultStats(); }
                updateUIProgress();
            });
        } else {
            const localData = localStorage.getItem('timo_' + currentStudentId);
            if (localData) { userStats = JSON.parse(localData); if(!userStats.myToys) userStats.myToys = []; }
            else { userStats = getDefaultStats(); }
            updateUIProgress();
        }
    }

    function saveProgress() {
        if (!currentStudentId) return;
        if (db) db.ref('students/' + currentStudentId).set(userStats);
        else localStorage.setItem('timo_' + currentStudentId, JSON.stringify(userStats));
        updateUIProgress();
    }

    function updateUIProgress() {
        document.getElementById('stars').innerText = userStats.stars || 0;
        const cabinet = document.getElementById('my-toys');
        if (userStats.myToys && userStats.myToys.length > 0) {
            cabinet.innerHTML = userStats.myToys.map(icon => `<span class="toy-item">${icon}</span>`).join(' ');
        } else {
            cabinet.innerText = "Chưa có món quà nào. Hãy tích sao đổi nhé!";
        }
    }

    function resetStars() {
        if (confirm("Bố có chắc chắn muốn đặt lại số ⭐ Ngôi sao của bé về 0 không?")) {
            userStats.stars = 0;
            saveProgress();
            alert("Đã reset số Ngôi sao về 0 thành công!");
            openParentDashboard();
        }
    }

    function resetAllData() {
        if (confirm("⚠️ Hành động này sẽ xoá toàn bộ lịch sử làm bài và quà đã đổi của bé.\n\nBố có chắc chắn muốn RESET TOÀN BỘ không?")) {
            userStats = getDefaultStats();
            saveProgress();
            alert("Đã xoá toàn bộ thống kê thử nghiệm thành công!");
            openParentDashboard();
        }
    }

    let mode = '', examQueue = [], currentQuestionIdx = 0, totalQuestions = 0;
    let clickedCount = 0, correctAnswer = 0, selectedOption = null, isConfirmed = false;
    let startTime = 0, currentTopicKey = '';

    const names = ['Bé Nam', 'Bé Lan', 'Bé Minh', 'Bé An', 'Bé Bình'];
    const items = [{a: '🍎 Táo', b: '🍊 Cam', c: '🍓 Dâu'}, {a: '🍬 Kẹo', b: '🍪 Bánh', c: '🍫 Socola'}];

    function showMenu() {
        document.getElementById('menu-screen').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('store-screen').style.display = 'none';
        document.getElementById('parent-screen').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
        document.getElementById('progress').innerText = '';
    }

    function openStore() {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('store-screen').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';

        const grid = document.getElementById('store-items');
        grid.innerHTML = '';

        availableToys.forEach(toy => {
            const isOwned = userStats.myToys && userStats.myToys.includes(toy.icon);
            const canAfford = userStats.stars >= toy.price;

            const card = document.createElement('div');
            card.className = 'store-item';
            card.innerHTML = `
                <div class="store-icon">${toy.icon}</div>
                <div class="store-name">${toy.name}</div>
                <div style="font-weight:bold; color:#eab308; font-size:13px; margin-bottom:6px;">⭐ ${toy.price} Sao</div>
                <button class="buy-btn" ${isOwned || !canAfford ? 'disabled' : ''} onclick="buyToy('${toy.icon}', ${toy.price}, '${toy.name}')">
                    ${isOwned ? 'Đã Sở Hữu' : (canAfford ? 'Đổi Quà' : 'Thiếu Sao')}
                </button>
            `;
            grid.appendChild(card);
        });
    }

    function buyToy(icon, price, name) {
        if (userStats.stars >= price) {
            userStats.stars -= price;
            if(!userStats.myToys) userStats.myToys = [];
            userStats.myToys.push(icon);
            saveProgress();
            playVictorySound();
            fireConfetti();
            alert(`🎉 Chúc mừng bé đã sở hữu ${name} ${icon}!`);
            openStore();
        }
    }

    function startMode(selectedMode) {
        mode = selectedMode; currentQuestionIdx = 0;
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';

        if (mode === 'EXAM') {
            examQueue = [];
            const topics = ['LOGIC', 'ARITHMETIC', 'NUMBER_THEORY', 'GEOMETRY', 'COMBINATORICS'];
            topics.forEach(t => { for(let i=0; i<5; i++) examQueue.push(t); });
            examQueue.sort(() => Math.random() - 0.5);
            totalQuestions = 25;
        } else {
            totalQuestions = 5;
        }
        initQuestion();
    }

    function initQuestion() {
        selectedOption = null; isConfirmed = false; clickedCount = 0; startTime = Date.now();
        document.getElementById('feedback').innerText = '';
        document.getElementById('confirm-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('progress').innerText = `Câu ${currentQuestionIdx + 1}/${totalQuestions}`;

        currentTopicKey = (mode === 'EXAM') ? examQueue[currentQuestionIdx] : mode;

        switch(currentTopicKey) {
            case 'LOGIC': generateLogicProblem(); break;
            case 'ARITHMETIC': generateArithmeticProblem(); break;
            case 'NUMBER_THEORY': generateNumberTheoryProblem(); break;
            case 'GEOMETRY': generateGeometryProblem(); break;
            case 'COMBINATORICS': generateCombinatoricsProblem(); break;
        }
        renderOptions(correctAnswer);
    }

    function generateLogicProblem() {
        document.getElementById('question-text').innerText = '🧠 Bài toán Xếp hàng';
        const name = names[Math.floor(Math.random() * names.length)];
        const top = Math.floor(Math.random() * 5) + 2, bottom = Math.floor(Math.random() * 5) + 2;
        correctAnswer = top + bottom - 1;
        document.getElementById('display-area').innerHTML = `<div class="text-problem">Trong một hàng dọc, <b>${name}</b> đứng thứ <b>${top}</b> từ trên xuống và đứng thứ <b>${bottom}</b> từ dưới lên.<br><br>Hỏi hàng đó có tất cả bao nhiêu bạn?</div>`;
    }

    function generateArithmeticProblem() {
        document.getElementById('question-text').innerText = '🔢 Tính nhanh tổng dãy số';
        const step = Math.floor(Math.random() * 2) + 1, start = 1, count = 4;
        let seq = [], sum = 0;
        for(let i=0; i<count; i++) { let val = start + i * step; seq.push(val); sum += val; }
        correctAnswer = sum;
        document.getElementById('display-area').innerHTML = `<div class="number-text">${seq.join(' + ')} = ?</div>`;
    }

    function generateNumberTheoryProblem() {
        document.getElementById('question-text').innerText = '💡 Điền số thích hợp vào dấu [ ? ]';
        const step = Math.floor(Math.random() * 3) + 2, start = Math.floor(Math.random() * 5) + 1;
        let seq = [];
        for(let i=0; i<5; i++) seq.push(start + i * step);
        const hideIdx = Math.floor(Math.random() * 3) + 1;
        correctAnswer = seq[hideIdx]; seq[hideIdx] = '[ ? ]';
        document.getElementById('display-area').innerHTML = `<div class="number-text">${seq.join(', ')}</div>`;
    }

    function generateGeometryProblem() {
        document.getElementById('question-text').innerText = '📐 Hình dưới đây có bao nhiêu CẠNH?';
        const points = [[40, 30], [120, 30], [120, 110], [210, 110], [210, 180], [40, 180]];
        correctAnswer = points.length;
        const display = document.getElementById('display-area');
        display.innerHTML = '<svg id="svg" width="260" height="200" viewBox="0 0 260 200"></svg><div class="hint-text">💡 Chạm vào từng CẠNH để đếm</div>';
        const svg = document.getElementById('svg');
        points.forEach((p1, i) => {
            const p2 = points[(i + 1) % points.length];
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', p1[0]); line.setAttribute('y1', p1[1]);
            line.setAttribute('x2', p2[0]); line.setAttribute('y2', p2[1]);
            line.setAttribute('class', 'clickable-edge');
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', (p1[0] + p2[0]) / 2); text.setAttribute('y', (p1[1] + p2[1]) / 2);
            text.setAttribute('fill', '#dc2626'); text.setAttribute('font-weight', 'bold');
            line.onclick = () => {
                if (!isConfirmed && !line.classList.contains('clicked')) {
                    line.classList.add('clicked'); clickedCount++; text.textContent = clickedCount; playTapSound();
                }
            };
            svg.appendChild(line); svg.appendChild(text);
        });
    }

    function generateCombinatoricsProblem() {
        document.getElementById('question-text').innerText = '🧩 Bài toán Quy đổi';
        const set = items[Math.floor(Math.random() * items.length)];
        const r1 = 2, r2 = 3;
        correctAnswer = r1 * r2;
        document.getElementById('display-area').innerHTML = `<div class="text-problem">Biết rằng:<br>1 ${set.a} = <b>${r1}</b> ${set.b}<br>1 ${set.b} = <b>${r2}</b> ${set.c}<br><br>Hỏi <b>1 ${set.a}</b> đổi được bao nhiêu <b>${set.c}</b>?</div>`;
    }

    function renderOptions(correct) {
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        let opts = new Set([correct]);
        while(opts.size < 4) {
            let wrong = correct + (Math.floor(Math.random() * 5) - 2);
            if (wrong > 0 && wrong !== correct) opts.add(wrong);
        }
        Array.from(opts).sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn'; btn.innerText = opt; btn.id = `opt-${opt}`;
            btn.onclick = () => selectOption(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(val) {
        if (isConfirmed) return;
        selectedOption = val;
        document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
        document.getElementById(`opt-${val}`).classList.add('selected');
        document.getElementById('confirm-btn').style.display = 'block';
        playTapSound();
    }

    function confirmAnswer() {
        if (!selectedOption || isConfirmed) return;
        isConfirmed = true;
        document.getElementById('confirm-btn').style.display = 'none';

        const timeTaken = Math.round((Date.now() - startTime) / 1000);
        const isCorrect = (selectedOption === correctAnswer);

        userStats.totalDone++;
        if (!userStats.topics[currentTopicKey]) userStats.topics[currentTopicKey] = { name: currentTopicKey, correct: 0, wrong: 0, timeTotal: 0 };
        userStats.topics[currentTopicKey].timeTotal += timeTaken;

        const feedback = document.getElementById('feedback');
        const selectedBtn = document.getElementById(`opt-${selectedOption}`);
        const correctBtn = document.getElementById(`opt-${correctAnswer}`);

        if (isCorrect) {
            userStats.topics[currentTopicKey].correct++;
            userStats.stars += 10;
            feedback.innerText = '🎉 Chính xác! Giỏi lắm con!';
            feedback.className = 'feedback correct';
            selectedBtn.className = 'opt-btn correct-ans';
            playCorrectSound();
            fireConfetti();
        } else {
            userStats.topics[currentTopicKey].wrong++;
            feedback.innerText = `❌ Chưa đúng! Đáp án đúng là ${correctAnswer}`;
            feedback.className = 'feedback wrong';
            selectedBtn.className = 'opt-btn wrong-ans';
            if (correctBtn) correctBtn.className = 'opt-btn correct-ans';
            playWrongSound();
        }

        saveProgress();
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIdx++;
        if (currentQuestionIdx < totalQuestions) {
            initQuestion();
        } else {
            playVictorySound();
            fireConfettiFull();
            alert(`🎉 Hoàn thành bài luyện tập! Bé tích lũy được tổng cộng ${userStats.stars} ⭐ Ngôi sao!`);
            showMenu();
        }
    }

    function openParentDashboard() {
        const password = prompt("Nhập mật khẩu phụ huynh để vào (Mặc định: 1234):");
        if (password !== "1234") { alert("Mật khẩu không đúng!"); return; }

        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('parent-screen').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';

        document.getElementById('total-done-count').innerText = userStats.totalDone || 0;
        const container = document.getElementById('stats-container');
        container.innerHTML = '';

        Object.keys(userStats.topics).forEach(key => {
            const t = userStats.topics[key];
            const total = t.correct + t.wrong;
            const percent = total > 0 ? Math.round((t.correct / total) * 100) : 0;
            const avgTime = total > 0 ? Math.round(t.timeTotal / total) : 0;

            const card = document.createElement('div');
            card.className = 'stat-card';
            card.innerHTML = `
                <div style="font-weight:bold; color:#334155">${t.name}</div>
                <div style="font-size: 13px; color: #475569; margin: 4px 0;">
                    Đúng: <b style="color:#16a34a">${t.correct}</b> | Sai: <b style="color:#dc2626">${t.wrong}</b> | Tỷ lệ: <b>${percent}%</b> | TB: <b>${avgTime}s/câu</b>
                </div>
                <div class="stat-bar">
                    <div class="stat-fill-correct" style="width: ${percent}%"></div>
                    <div class="stat-fill-wrong" style="width: ${100 - percent}%"></div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function playTapSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.05);
    }

    function playCorrectSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(now + 0.4);
    }

    function playWrongSound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.setValueAtTime(150, now + 0.15);
        osc.connect(ctx.destination);
        osc.start(); osc.stop(now + 0.3);
    }

    function playVictorySound() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            osc.connect(ctx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.15);
        });
    }

    function fireConfetti() { confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } }); }
    function fireConfettiFull() { confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); }

    // Khởi tạo màn hình chính
    renderSavedAccounts();
</script>
